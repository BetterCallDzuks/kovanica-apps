name: wallet-web-ci

on:
  pull_request:
    paths:
      - 'wallet-web/**'
      - '.github/workflows/wallet-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'wallet-web/**'
      - '.github/workflows/wallet-web-ci.yml'

permissions:
  contents: read

concurrency:
  group: wallet-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Typecheck, Vectors & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wallet-web
    steps:
      - uses: actions/checkout@v4

      - name: Checkout BetterCallDzuks/kovanica-sdk
        uses: actions/checkout@v4
        with:
          repository: BetterCallDzuks/kovanica-sdk
          ref: e5f3b79bb32801816d3e48d2a30a3f7a566cb6ee
          path: kovanica-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wallet-web/package-lock.json

      - name: Build kovanica-sdk and link sibling
        run: |
          cd kovanica-sdk
          npm ci
          npm run build
          cd ..
          ln -s "$(pwd)/kovanica-sdk" "$(pwd)/../kovanica-sdk"
        working-directory: .

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Verify test vectors
        run: npx tsx src/core/check-vectors.ts

      - name: Verify receipt decoding, history rows & call estimation
        run: npx tsx --test src/core/receipt.test.ts src/core/history-row.test.ts src/core/call-estimate.test.ts

      - name: Build web wallet
        run: npm run build
