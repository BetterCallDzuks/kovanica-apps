name: console-desktop-ci

on:
  pull_request:
    paths:
      - 'console-desktop/**'
      - '.github/workflows/console-desktop-ci.yml'
  push:
    branches: [main]
    paths:
      - 'console-desktop/**'
      - '.github/workflows/console-desktop-ci.yml'

permissions:
  contents: read

concurrency:
  group: console-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Console Desktop (lint, test & build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
