name: android-node

on:
  pull_request:
    paths:
      - 'android-node/**'
      - 'android-chain/**'
      - '.github/workflows/android-node.yml'
  push:
    branches: [main]
    paths:
      - 'android-node/**'
      - 'android-chain/**'
      - '.github/workflows/android-node.yml'

permissions:
  contents: read

concurrency:
  group: android-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poc:
    name: Full node, light FFI, unit tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      L1_SHA: 6fba95d0d66027c0d4e257a8960e1a12758a45bd
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
    steps:
      - name: Checkout apps
        uses: actions/checkout@v4

      - name: Checkout L1 at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: KovanicaDAG/kovanica
          ref: 6fba95d0d66027c0d4e257a8960e1a12758a45bd
          path: kovanica-core

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-android-node-${{ hashFiles('kovanica-core/Cargo.lock') }}

      - name: Cross-compile the full node and the light library
        run: |
          set -euo pipefail
          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="${TOOLCHAIN}/bin:${PATH}"
          export CC_aarch64_linux_android="${TOOLCHAIN}/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="${TOOLCHAIN}/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${TOOLCHAIN}/bin/aarch64-linux-android24-clang"
          export CC_x86_64_linux_android="${TOOLCHAIN}/bin/x86_64-linux-android24-clang"
          export AR_x86_64_linux_android="${TOOLCHAIN}/bin/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${TOOLCHAIN}/bin/x86_64-linux-android24-clang"
          cd kovanica-core
          build_ffi() {
            local triple="$1"
            local abi="$2"
            echo "light ffi ${abi}"
            cargo build -p kovanica-light-ffi --release --target "${triple}"
            mkdir -p "../android-node/app/src/main/jniLibs/${abi}"
            cp "target/${triple}/release/libkovanica_light_ffi.so" \
              "../android-node/app/src/main/jniLibs/${abi}/libkovanica_light_ffi.so"
            "${TOOLCHAIN}/bin/llvm-strip" --strip-unneeded \
              "../android-node/app/src/main/jniLibs/${abi}/libkovanica_light_ffi.so"
          }
          build_node() {
            local triple="$1"
            local abi="$2"
            local log="/tmp/kovanica-node-${abi}.log"
            echo "full node ${abi}"
            set +e
            cargo build -p kovanica-node --release --target "${triple}" >"${log}" 2>&1
            local code=$?
            set -e
            if [ "${code}" -eq 0 ]; then
              cp "target/${triple}/release/kovanica-node" \
                "../android-node/app/src/main/jniLibs/${abi}/libkovanica_node.so"
              "${TOOLCHAIN}/bin/llvm-strip" --strip-unneeded \
                "../android-node/app/src/main/jniLibs/${abi}/libkovanica_node.so"
              echo "full node ${abi}: built" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "full node ${abi}: not packaged (L1 cross-compile failed, exit ${code}). Light mode is the fallback." >> "${GITHUB_STEP_SUMMARY}"
              echo '```' >> "${GITHUB_STEP_SUMMARY}"
              tail -n 40 "${log}" >> "${GITHUB_STEP_SUMMARY}"
              echo '```' >> "${GITHUB_STEP_SUMMARY}"
            fi
          }
          build_ffi aarch64-linux-android arm64-v8a
          build_ffi x86_64-linux-android x86_64
          build_node aarch64-linux-android arm64-v8a
          build_node x86_64-linux-android x86_64

      - name: Unit tests, lint, debug APK
        working-directory: android-node
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Record the debug APK
        run: |
          apk=$(find android-node/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "${apk}"
          name=$(basename "${apk}")
          size=$(stat -c%s "${apk}")
          hash=$(sha256sum "${apk}" | awk '{print $1}')
          {
            echo "### Debug APK"
            echo "- name: ${name}"
            echo "- size: ${size} bytes"
            echo "- sha256: ${hash}"
            echo "- L1: ${L1_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
